<style>

    a {
        color: black;
        text-decoration: none;
    }

    .head-banner-container {
        border-bottom: {{border_weight}}px {{border_style}} {{border_color}};
        padding-bottom: {{padding}}px;
        padding-top: {{padding}}px;
        background: {{bg_color}};
    }
    
    .head-banner-container { 
        /* this is to override the automatic padding applied by auto-generated
         bigcommerce container divs */
        width: 100vw; 
        margin-left: calc(50% - 50vw);
    }

    .head-banner-text-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: {{gap_between}}px;
    }

    .head-banner-icons {
        width: 25px;
        height: 25px;
    }
    .head-banner-right {
        display: none;
    }

    @media (min-width: 1023px) {
       .head-banner-container {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-column-gap: 20px;
       }
       .head-banner-text-container {
        grid-column-start: 2;
        gap: {{gap_between}}px;
        }
        .head-banner-right {
            display: flex;
            justify-content: right;
            margin-right: 15px;
        }
        .head-banner-right-link-2 {
            display: inline-block;
            border-left: 2px solid black;
            padding-left: 6px;
            margin-left: 8px;
        }
        .utility-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
    }


</style>

<div>
    <div class="head-banner-container">

        <div class="head-banner-text-container"> 
            <a class="head-banner-text">
                <span><strong>{{bold_banner_text}}</strong></span>
                {{banner_text}}
            </a>
            <img 
                class="head-banner-icons"
                src="{{banner_icon.src}}"
                alt="head banner icon"
            />
        </div>

        <div class="head-banner-right">
            <nav class="utility-nav" aria-label="Utility Navigation">
                <a 
                class="head-banner-right-icon" 
                href="{{head_banner_right_link1}}"
                >
                    <img 
                        class="head-banner-icons"
                        src="{{banner_right_icon.src}}"
                        alt="head banner right icon"
                    />
                </a>

                <a 
                href="{{head_banner_right_link1}}"
                >
                    <div class="utility-nav-location-icon"></div>
                    {{head_banner_right_text1}}
                </a>

                <a 
                class="head-banner-right-link-2" 
                href="{{head_banner_right_link2}}"
                >
                    {{head_banner_right_text2}}
                </a>
            </nav>
        </div>
    </div>
</div>
